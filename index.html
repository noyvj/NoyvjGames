<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOL — Milestone 4</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
  <div id="game">
    <h1>SOL</h1>
    <p id="resource-label">Iron — Earth</p>
    <p id="resource-count">0</p>
    <button id="click-button" disabled>Loading...</button>

    <div id="automation">
      <p id="generator-info">
        Auto-Miners: <span id="generator-count">0</span>
        (+<span id="generator-rate">0</span>/s)
      </p>
      <button id="buy-generator-button" class="secondary" disabled>Loading...</button>
    </div>

    <div id="ecology">
      <p id="ecology-label">Ecological Health</p>
      <p id="ecology-percent">100%</p>
      <div class="meter">
        <div id="ecology-bar" class="meter-fill"></div>
      </div>
      <p id="ecology-status"></p>

      <p id="recycler-info">
        Recyclers: <span id="recycler-count">0</span>
        (+<span id="recycler-rate">0</span>%/s)
      </p>
      <button id="buy-recycler-button" class="secondary" disabled>Loading...</button>
    </div>

    <div id="research">
      <p id="research-label">Research — Near Bodies Tier</p>
      <p id="research-progress">0 / 1000</p>
      <div class="meter">
        <div id="research-bar" class="meter-fill research-fill"></div>
      </div>
      <p id="research-status"></p>
      <button id="fund-research-button" class="secondary" disabled>Loading...</button>
    </div>
  </div>

  <script>
    async function main() {
      const pyodide = await loadPyodide();
      const response = await fetch("game.py");
      const code = await response.text();
      await pyodide.runPythonAsync(code);
    }
    main();
  </script>
</body>
</html>
