<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Demo Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hub-header">
    <h1>Game Demo Hub</h1>
    <p id="hub-tagline">Small AI-assisted game demos, built one milestone at a time.</p>
  </header>

  <main id="game-grid">
    <article class="title-card">
      <a class="title-card-link" href="games/sol/index.html">
        <div class="title-card-thumb" style="background: #3a5a9c;"></div>
        <h2 class="title-card-name">SOL</h2>
        <p class="title-card-blurb">Solar-system incremental clicker — click, automate, and expand outward through the solar system.</p>
      </a>

      <div class="review-widget">
        <!-- TODO: persistence pending hosting setup -->
        <div class="star-rating" data-rating="0">
          <button type="button" class="star" data-value="1">&#9733;</button>
          <button type="button" class="star" data-value="2">&#9733;</button>
          <button type="button" class="star" data-value="3">&#9733;</button>
          <button type="button" class="star" data-value="4">&#9733;</button>
          <button type="button" class="star" data-value="5">&#9733;</button>
        </div>
        <textarea class="comment-box" placeholder="Leave a comment... (not saved yet)"></textarea>
        <button type="button" class="comment-submit" disabled>Submit (coming soon)</button>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
