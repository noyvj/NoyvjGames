<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Chronicle review</title>
<link rel="stylesheet" href="../../shared/theme-light-games.css">
<link rel="stylesheet" href="style.css">
<script src="../../shared/theme.js"></script>
<script src="settings.js"></script>
<style>
  #game { max-width: 64rem; }
  .rv-claim { border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.8rem; margin: 0.6rem 0; background: var(--surface); }
  .rv-claim h3 { margin: 0 0 0.2rem; }
  .rv-meta { color: var(--muted); font-size: 0.85rem; }
  .rv-problem { border: 3px double var(--accent-ink); padding: 0.4rem 0.6rem; border-radius: 8px; font-weight: 700; }
  .rv-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .rv-table th, .rv-table td { text-align: left; vertical-align: top; border-top: 1px solid var(--line); padding: 0.35rem 0.4rem; }
  #rv-accounts, #rv-decisions, #rv-relations, .rv-claim { overflow-x: auto; }
  .rv-table { min-width: 36rem; }
  .rv-filter { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 0.5rem 0; }
</style>
</head>
<body>
<main id="game">
  <a href="index.html" class="hub-back-link">&larr; Chronicle</a>
  <h1>Review</h1>
  <p class="tagline">For the owner's spot check. Every claim in a set, with its three or more sources and its confidence level, so a wrong fact is easy to find. This page gives away every answer; it is not linked from the game.</p>
  <div class="rv-filter">
    <label for="rv-set">Set</label> <select id="rv-set"></select>
    <label for="rv-conf">Show</label>
    <select id="rv-conf">
      <option value="all">All claims</option>
      <option value="documented">Documented only</option>
      <option value="disputed">Disputed only</option>
      <option value="traditional-but-doubtful">Traditional but doubtful only</option>
    </select>
    <label for="rv-q">Find</label> <input id="rv-q" type="text" placeholder="words in a claim or source" autocomplete="off">
  </div>
  <p id="rv-status" class="note" role="status">Loading...</p>
  <p id="rv-draft" class="draft-banner" hidden></p>
  <section id="rv-summary" class="panel" hidden></section>
  <section id="rv-relations" class="panel" hidden></section>
  <section id="rv-chapters" class="panel" hidden></section>
  <section id="rv-accounts" class="panel" hidden></section>
  <section id="rv-decisions" class="panel" hidden></section>
  <div id="rv-body"></div>
</main>
<script>
(function () {
  "use strict";
  var FILES = ["meta", "sources", "entities", "claims", "relations", "sections", "readings"];
  var sets = {};
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmt(d) {
    var m = /^(-?\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/.exec(d || "");
    if (!m) return d;
    var y = parseInt(m[1], 10), label = y < 0 ? (-y) + " BCE" : String(y);
    if (!m[2]) return label;
    if (!m[3]) return MONTHS[parseInt(m[2], 10) - 1] + " " + label;
    return parseInt(m[3], 10) + " " + MONTHS[parseInt(m[2], 10) - 1] + " " + label;
  }
  var SYMBOL = { "documented": "✔", "disputed": "≈", "traditional-but-doubtful": "?" };

  async function load() {
    var index = await (await fetch("sets/index.json")).json();
    for (var i = 0; i < index.sets.length; i++) {
      var folder = index.sets[i].folder, data = {};
      for (var f = 0; f < FILES.length; f++) data[FILES[f]] = await (await fetch("sets/" + folder + "/" + FILES[f] + ".json")).json();
      var chResp = await fetch("sets/" + folder + "/chapters.json");        // optional: the cause web's and myth-or-record's chapters
      data.chapters = chResp.ok ? await chResp.json() : { web: [], myth: [] };
      var acResp = await fetch("sets/" + folder + "/accounts.json");         // optional: whose-account passages
      data.accounts = acResp.ok ? (await acResp.json()).accounts || [] : [];
      var dcResp = await fetch("sets/" + folder + "/decisions.json");        // optional: decision points
      data.decisions = dcResp.ok ? (await dcResp.json()).decisions || [] : [];
      sets[data.meta.id] = data;
      var o = el("option", null, data.meta.title); o.value = data.meta.id; $("rv-set").appendChild(o);
    }
    $("rv-status").textContent = "";
    render();
  }

  // The same three-source rule the engine enforces, checked again here so this page cannot hide a bad claim.
  function problemsFor(set, claim) {
    var out = [], refs = claim.sources || [], urls = {}, inst = {};
    if (refs.length < 3) out.push("Only " + refs.length + " source(s): three are required.");
    refs.forEach(function (r) {
      var s = set.sources[r.source];
      if (!s) { out.push("Unknown source " + r.source); return; }
      if (!/^https?:\/\//.test(s.url || "")) out.push("Source " + r.source + " has no URL.");
      if (!s.read) out.push("Source " + r.source + " has no read date.");
      urls[s.url] = 1; inst[(s.institution || s.author || "").toLowerCase()] = 1;
    });
    if (Object.keys(urls).length < 3) out.push("Fewer than three distinct URLs.");
    if (Object.keys(inst).length < 2) out.push("Fewer than two different institutions.");
    return out;
  }

  function render() {
    var set = sets[$("rv-set").value];
    if (!set) return;
    var conf = $("rv-conf").value, q = $("rv-q").value.trim().toLowerCase();
    var draft = $("rv-draft");
    draft.hidden = set.meta.status === "reviewed";
    draft.textContent = set.meta.status_label + " (version " + set.meta.version + ", drafted " + (set.meta.drafted || "unknown") + ").";
    var entity = {};
    set.entities.events.forEach(function (e) { entity[e.id] = e.title; });
    set.entities.people.forEach(function (e) { entity[e.id] = e.name; });
    set.entities.places.forEach(function (e) { entity[e.id] = e.name; });
    var counts = { documented: 0, disputed: 0, "traditional-but-doubtful": 0 }, bad = 0;
    set.claims.forEach(function (c) { counts[c.confidence]++; if (problemsFor(set, c).length) bad++; });
    var sum = $("rv-summary"); sum.hidden = false; sum.textContent = "";
    sum.appendChild(el("p", null, set.claims.length + " claims: " + counts.documented + " documented, " + counts.disputed + " disputed, " + counts["traditional-but-doubtful"] + " traditional but doubtful. " + Object.keys(set.sources).length + " distinct sources. " + (bad ? bad + " claim(s) break the source rule (marked below)." : "Every claim meets the source rule (three or more distinct sources, two or more institutions, URL and read date on each).")));
    var body = $("rv-body"); body.textContent = "";
    var shown = 0;
    renderRelations(set, entity, conf, q);
    renderChapters(set);
    renderAccounts(set, entity);
    renderDecisions(set, entity);
    set.claims.forEach(function (c) {
      if (conf !== "all" && c.confidence !== conf) return;
      var hay = (c.text + " " + c.value + " " + (entity[c.subject] || "") + " " + c.sources.map(function (r) { var s = set.sources[r.source] || {}; return (s.title || "") + " " + (s.institution || "") + " " + (r.note || ""); }).join(" ")).toLowerCase();
      if (q && hay.indexOf(q) < 0) return;
      shown++;
      var box = el("div", "rv-claim");
      var hidden = c.field === "account" || c.field === "decision";
      var rel = c.field === "relation" ? (set.relations || []).filter(function (r) { return r.claim === c.id; })[0] : null;
      box.appendChild(el("h3", null, hidden ? (c.field === "account" ? "Account fact: " : "Decision point: ") + (entity[c.subject] || c.subject) + " (" + c.value + ")" : rel ? "Cause link: " + entity[rel.from] + " led to " + entity[rel.to] + " (" + rel.strength + ")" : (entity[c.subject] || c.subject) + " · " + c.field + (c.field === "date" ? ": " + fmt(c.value) : "")));
      box.appendChild(el("p", null, c.text));
      box.appendChild(el("p", "rv-meta", "claim " + c.id + " · " + SYMBOL[c.confidence] + " " + c.confidence));
      (c.alternatives || []).forEach(function (a) { box.appendChild(el("p", "rv-meta", "Alternative position: " + a)); });
      var probs = problemsFor(set, c);
      probs.forEach(function (p) { box.appendChild(el("p", "rv-problem", "✖ " + p)); });
      var t = el("table", "rv-table");
      var head = el("tr"); ["Source", "Published by", "Read", "What it confirms"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      t.appendChild(head);
      c.sources.forEach(function (r) {
        var s = set.sources[r.source] || {};
        var tr = el("tr");
        var td = el("td"); var a = el("a", null, s.title || r.source); a.href = s.url || "#"; a.target = "_blank"; a.rel = "noopener noreferrer"; td.appendChild(a); tr.appendChild(td);
        tr.appendChild(el("td", null, s.institution || s.author || ""));
        tr.appendChild(el("td", null, s.read || "missing"));
        tr.appendChild(el("td", null, r.note || ""));
        t.appendChild(tr);
      });
      box.appendChild(t);
      body.appendChild(box);
    });
    if (!shown) body.appendChild(el("p", "note", "No claims match."));
  }
  // Every cause link of the set with its strength, its claim's confidence and how many sources back it.
  function renderRelations(set, entity) {
    var box = $("rv-relations"); box.textContent = "";
    var rels = set.relations || [];
    box.hidden = !rels.length;
    if (!rels.length) return;
    box.appendChild(el("h2", null, "Cause links (" + rels.length + ")"));
    box.appendChild(el("p", "note", "The cause web confirms only these links. Each is a claim below with its own sources (search for the claim id). Strength: direct = the sources treat it as the immediate trigger; contributing = one factor among several."));
    var t = el("table", "rv-table");
    var head = el("tr"); ["Link", "Cause", "Effect", "Strength", "Confidence", "Sources", "Claim"].forEach(function (h) { head.appendChild(el("th", null, h)); });
    t.appendChild(head);
    var claims = {}; set.claims.forEach(function (c) { claims[c.id] = c; });
    rels.forEach(function (r) {
      var c = claims[r.claim] || { sources: [], confidence: "missing" };
      var tr = el("tr");
      [r.id, entity[r.from] || r.from, entity[r.to] || r.to, r.strength, (SYMBOL[c.confidence] || "") + " " + c.confidence, String(c.sources.length) + (c.sources.length < 3 ? " (too few)" : ""), r.claim].forEach(function (x) { tr.appendChild(el("td", null, x)); });
      t.appendChild(tr);
    });
    box.appendChild(t);
  }

  function renderChapters(set) {
    var box = $("rv-chapters"); box.textContent = "";
    var ch = set.chapters || { web: [], myth: [] };
    var n = (ch.web || []).length + (ch.myth || []).length;
    box.hidden = !n;
    if (!n) return;
    box.appendChild(el("h2", null, "Chapters (the cause web and myth or record)"));
    (ch.web || []).forEach(function (c) { box.appendChild(el("p", null, "Cause web, " + c.title + " (" + c.id + "): " + c.events.length + " moments, puzzles of " + c.size + ".")); });
    (ch.myth || []).forEach(function (c) { box.appendChild(el("p", null, "Myth or record, " + c.title + " (" + c.id + "): " + c.claims.length + " claims, puzzles of " + c.size + ".")); });
  }

  // Whose account?: every passage with its source, author, date, kind and the points it mentions or leaves out. The
  // passage text is MY summary, so the owner checks it against the linked source; the classification is an editorial reading.
  function renderAccounts(set, entity) {
    var box = $("rv-accounts"); box.textContent = "";
    var accounts = set.accounts || [];
    box.hidden = !accounts.length;
    if (!accounts.length) return;
    var passages = accounts.reduce(function (n, a) { return n + a.passages.length; }, 0);
    box.appendChild(el("h2", null, "Whose account? (" + accounts.length + " accounts, " + passages + " passages)"));
    box.appendChild(el("p", "note", "Each passage is a short ORIGINAL summary of one real source: check that it is fair to the source, and that the classification (kind, what the writer could see, purpose, which points it mentions) is a reasonable reading. Every point is a claim below with its own three sources (search the claim id)."));
    accounts.forEach(function (a) {
      box.appendChild(el("h3", null, a.title + " (about " + (entity[a.event] || a.event) + ")"));
      var pts = {}; a.points.forEach(function (pt) { pts[pt.id] = pt; });
      var pt = el("table", "rv-table");
      var h0 = el("tr"); ["Point", "Claim", "Sources"].forEach(function (h) { h0.appendChild(el("th", null, h)); });
      pt.appendChild(h0);
      var claims = {}; set.claims.forEach(function (c) { claims[c.id] = c; });
      a.points.forEach(function (x) {
        var c = claims[x.claim] || { sources: [] };
        var tr = el("tr");
        [x.label, x.claim, String(c.sources.length) + (c.sources.length < 3 ? " (too few)" : "")].forEach(function (v) { tr.appendChild(el("td", null, v)); });
        pt.appendChild(tr);
      });
      box.appendChild(pt);
      var t = el("table", "rv-table");
      var head = el("tr"); ["Passage", "Author", "Written", "Kind", "Could see", "Purpose", "Source (read)", "Mentions", "Leaves out", "Text"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      t.appendChild(head);
      a.passages.forEach(function (p) {
        var s = set.sources[p.source] || {};
        var tr = el("tr");
        var link = el("td"); var an = el("a", null, (s.title || p.source)); an.href = s.url || "#"; an.target = "_blank"; an.rel = "noopener noreferrer"; link.appendChild(an); link.appendChild(document.createTextNode(" (" + (s.institution || s.author || "") + ", read " + (s.read || "missing") + ")"));
        var cells = [p.id, p.author, p.written ? fmt(p.written) : "undated web page", p.kind, p.vantage, p.purpose + ": " + p.purpose_note];
        cells.forEach(function (v) { tr.appendChild(el("td", null, v)); });
        tr.appendChild(link);
        tr.appendChild(el("td", null, p.mentions.map(function (m) { return pts[m] ? pts[m].label : m; }).join("; ")));
        tr.appendChild(el("td", null, a.points.filter(function (x) { return p.mentions.indexOf(x.id) < 0; }).map(function (x) { return x.label; }).join("; ") || "nothing"));
        tr.appendChild(el("td", null, p.text));
        t.appendChild(tr);
      });
      box.appendChild(t);
    });
  }

  // Decision points: the options, which one was chosen, and the three claims (options, choice, what followed).
  function renderDecisions(set, entity) {
    var box = $("rv-decisions"); box.textContent = "";
    var decisions = set.decisions || [];
    box.hidden = !decisions.length;
    if (!decisions.length) return;
    box.appendChild(el("h2", null, "Decision points (" + decisions.length + ")"));
    box.appendChild(el("p", "note", "A decision point exists only where the sources document the options, the choice and what followed. Check that each option really was on the table, that the choice is what the figure did, and that nothing here reads as alternate history. Each part is a claim below with three sources (search the claim id)."));
    var claims = {}; set.claims.forEach(function (c) { claims[c.id] = c; });
    var t = el("table", "rv-table");
    var head = el("tr"); ["Decision", "Who and when", "Options", "What they chose", "Claims (options, choice, after) and source counts"].forEach(function (h) { head.appendChild(el("th", null, h)); });
    t.appendChild(head);
    decisions.forEach(function (d) {
      var tr = el("tr");
      tr.appendChild(el("td", null, d.title + " (" + d.id + ", about " + (entity[d.event] || d.event) + ")"));
      tr.appendChild(el("td", null, d.who + ", " + d.when));
      tr.appendChild(el("td", null, d.options.map(function (o) { return o.id + ": " + o.text; }).join(" | ")));
      tr.appendChild(el("td", null, d.chosen));
      tr.appendChild(el("td", null, ["options", "choice", "after"].map(function (k) { var c = claims[d.claims[k]] || { sources: [] }; return d.claims[k] + " (" + c.sources.length + (c.sources.length < 3 ? ", too few" : "") + ")"; }).join("; ")));
      t.appendChild(tr);
    });
    box.appendChild(t);
  }

  $("rv-set").addEventListener("change", render);
  $("rv-conf").addEventListener("change", render);
  $("rv-q").addEventListener("input", render);
  load().catch(function (e) { $("rv-status").textContent = "Could not load the sets: " + e; });
})();
</script>
</body>
</html>
