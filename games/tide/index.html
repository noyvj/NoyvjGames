<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tide — Milestone 1</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/ad-bar.css">
<link rel="manifest" href="/manifest.json">
<!-- AdSense: placeholder client ID until application is approved -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
  <div id="game">
    <h1>Tide</h1>
    <p class="tagline">Run a coastal settlement. Balance fishing income against ocean health and a slowly rising sea.</p>

    <div id="status" class="section">
      <p id="season-display" class="status-line">Season 1</p>
      <p id="funds-display" class="status-line">Funds: 300</p>
      <p id="acidity-display" class="status-line">Ocean acidity: 0.0</p>
      <p id="fish-yield-display" class="status-line">Fishing yield: 100%</p>
      <p id="sea-level-display" class="status-line">Sea level: 0</p>
      <p id="damage-display" class="status-line">Cumulative damage: 0</p>
    </div>

    <div id="coastline-grid" class="coastline-grid"></div>

    <div id="investments" class="section">
      <div class="invest-row" data-category="output">
        <span class="invest-name">Output</span>
        <span class="invest-count" id="output-count">0</span>
        <button id="output-invest-button" class="secondary" disabled>Loading...</button>
      </div>
      <div class="invest-row" data-category="reduction">
        <span class="invest-name">Acidity Reduction</span>
        <span class="invest-count" id="reduction-count">0</span>
        <button id="reduction-invest-button" class="secondary" disabled>Loading...</button>
      </div>
      <div class="invest-row" data-category="adaptation">
        <span class="invest-name">Adaptation</span>
        <span class="invest-count" id="adaptation-count">0</span>
        <button id="adaptation-invest-button" class="secondary" disabled>Loading...</button>
      </div>
    </div>

    <button id="advance-season-button" class="primary">Advance Season</button>
  </div>

  <div class="ad-bar ad-bar--bottom">
    <span class="ad-bar-label ad-bar-label-full">Advertisement — not part of the game</span>
    <span class="ad-bar-label ad-bar-label-short">Ad</span>
    <!-- Google AdSense manual display ad unit -->
    <ins class="adsbygoogle"
         style="display:block; width:320px; height:50px;"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <script>
    async function main() {
      const pyodide = await loadPyodide();
      const response = await fetch("game.py");
      const code = await response.text();
      await pyodide.runPythonAsync(code);
    }
    main();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
