<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aftermath — Milestone 1</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/ad-bar.css">
<link rel="manifest" href="/manifest.json">
<!-- AdSense: placeholder client ID until application is approved -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
  <div id="game">
    <h1>Aftermath</h1>
    <p class="tagline">A settlement facing a scheduled run of extreme weather. Build resilience to weather it, or growth to afford more later.</p>

    <div id="status" class="section">
      <p id="progress-display" class="status-line">Event 1 of 5</p>
      <p id="next-event-display" class="status-line">Next: Flood</p>
      <p id="resources-display" class="status-line">Resources: 200</p>
      <p id="resilience-display" class="status-line">Resilience: 0</p>
      <p id="growth-display" class="status-line">Growth: 0</p>
    </div>

    <div id="actions" class="section">
      <button id="resilience-invest-button" class="secondary" disabled>Loading...</button>
      <button id="growth-invest-button" class="secondary" disabled>Loading...</button>
    </div>

    <button id="resolve-event-button" class="primary">Face Next Event</button>
  </div>

  <div class="ad-bar ad-bar--bottom">
    <span class="ad-bar-label ad-bar-label-full">Advertisement — not part of the game</span>
    <span class="ad-bar-label ad-bar-label-short">Ad</span>
    <!-- Google AdSense manual display ad unit -->
    <ins class="adsbygoogle"
         style="display:block; width:320px; height:50px;"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <script>
    async function main() {
      const pyodide = await loadPyodide();
      const response = await fetch("game.py");
      const code = await response.text();
      await pyodide.runPythonAsync(code);
    }
    main();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
