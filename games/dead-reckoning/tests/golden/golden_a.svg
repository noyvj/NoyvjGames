<svg class="dr-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536.0 566.0" role="img" aria-labelledby="dr-chart-title dr-chart-desc" id="dr-chart"><title id="dr-chart-title">Chart of Golden Water</title><desc id="dr-chart-desc">Start at 1 east, 1 north. The flag is at 9 east, 9 north; arrive within 1 nm of it. Deadline 6 hours. Ship speed 3 to 6 kn. Little Rock: a rock at 5 east, 5 north, 1 nm across.</desc><defs><pattern id="dr-pat-land" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="dr-pat-bg-land" width="8" height="8"/><line class="dr-hatch" x1="0" y1="0" x2="0" y2="8"/></pattern><pattern id="dr-pat-reef" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect class="dr-pat-bg-reef" width="6" height="6"/><line class="dr-hatch-reef" x1="0" y1="0" x2="0" y2="6"/></pattern><pattern id="dr-pat-shoal" width="7" height="7" patternUnits="userSpaceOnUse"><rect class="dr-pat-bg-shoal" width="7" height="7"/><circle class="dr-dot" cx="2" cy="2" r="1.1"/><circle class="dr-dot" cx="5.5" cy="5.5" r="1.1"/></pattern></defs><rect class="dr-sea" x="40.0" y="56.0" width="480.0" height="480.0"/><g class="dr-grid"><line class="dr-grid-major" x1="40.0" y1="536.0" x2="40.0" y2="56.0"/><line class="dr-grid-major" x1="40.0" y1="536.0" x2="520.0" y2="536.0"/><line class="dr-grid-minor" x1="88.0" y1="536.0" x2="88.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="488.0" x2="520.0" y2="488.0"/><line class="dr-grid-minor" x1="136.0" y1="536.0" x2="136.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="440.0" x2="520.0" y2="440.0"/><line class="dr-grid-minor" x1="184.0" y1="536.0" x2="184.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="392.0" x2="520.0" y2="392.0"/><line class="dr-grid-minor" x1="232.0" y1="536.0" x2="232.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="344.0" x2="520.0" y2="344.0"/><line class="dr-grid-major" x1="280.0" y1="536.0" x2="280.0" y2="56.0"/><line clas