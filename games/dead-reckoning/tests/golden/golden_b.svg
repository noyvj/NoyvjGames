<svg class="dr-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536.0 566.0" role="img" aria-labelledby="dr-chart-title dr-chart-desc" id="dr-chart"><title id="dr-chart-title">Chart of Golden Strait</title><desc id="dr-chart-desc">Start at 1 east, 5 north. The flag is at 9 east, 5 north; arrive within 1 nm of it. Deadline 6 hours. Ship speed 3 to 6 kn. Land: Isle, between 4 and 6 east and 6 and 8 north. Reef: a reef at 5 east, 3 north, 1.6 nm across. Shoal: a shoal at 3 east, 2 north, 1.4 nm across. Current z: sets toward 090 (steady), 1 to 2 kn, between 3 and 8 east and 0 and 6 north. Wind from 270, 10 to 15 kn. It pushes the ship sideways a little (leeway). The Light: a lighthouse at 2 east, 8 north, seen from up to 8 nm.</desc><defs><pattern id="dr-pat-land" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="dr-pat-bg-land" width="8" height="8"/><line class="dr-hatch" x1="0" y1="0" x2="0" y2="8"/></pattern><pattern id="dr-pat-reef" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect class="dr-pat-bg-reef" width="6" height="6"/><line class="dr-hatch-reef" x1="0" y1="0" x2="0" y2="6"/></pattern><pattern id="dr-pat-shoal" width="7" height="7" patternUnits="userSpaceOnUse"><rect class="dr-pat-bg-shoal" width="7" height="7"/><circle class="dr-dot" cx="2" cy="2" r="1.1"/><circle class="dr-dot" cx="5.5" cy="5.5" r="1.1"/></pattern></defs><rect class="dr-sea" x="40.0" y="56.0" width="480.0" height="480.0"/><g class="dr-grid"><line class="dr-grid-major" x1="40.0" y1="536.0" x2="40.0" y2="56.0"/><line class="dr-grid-major" x1="40.0" y1="536.0" x2="520.0" y2="536.0"/><line class="dr-grid-minor" x1="88.0" y1="536.0" x2="88.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="488.0" x2="520.0" y2="488.0"/><line class="dr-grid-minor" x1="136.0" y1="536.0" x2="136.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="440.0" x2="520.0" y2="440.0"/><line class="dr-grid-minor" x1="184.0" y1="536.0" x2="184.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="392.0" x2="520.0" y2="392.0"/><line class="dr-grid-minor" x1="232.0" y1="536.0" x2="232.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="344.0" x2="520.0" y2="344.0"/><line class="dr-grid-major" x1="280.0" y1="536.0" x2="280.0" y2="56.0"/><line class="dr-grid-major" x1="40.0" y1="296.0" x2="520.0" y2="296.0"/><line class="dr-grid-minor" x1="328.0" y1="536.0" x2="328.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="248.0" x2="520.0" y2="248.0"/><line class="dr-grid-minor" x1="376.0" y1="536.0" x2="376.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="200.0" x2="520.0" y2="200.0"/><line class="dr-grid-minor" x1="424.0" y1="536.0" x2="424.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="152.0" x2="520.0" y2="152.0"/><line class="dr-grid-minor" x1="472.0" y1="536.0" x2="472.0" y2="56.0"/><line class="dr-grid-minor" x1="40.0" y1="104.0" x2="520.0" y2="104.0"/><line class="dr-grid-major" x1="520.0" y1="536.0" x2="520.0" y2="56.0"/><line class="dr-grid-major" x1="40.0" y1="56.0" x2="520.0" y2="56.0"/><text class="dr-tick" x="40.0" y="552.0" text-anchor="middle">0</text><text class="dr-tick" x="34.0" y="540.0" text-anchor="end">0</text><text class="dr-tick" x="280.0" y="552.0" text-anchor="middle">5</text><text class="dr-tick" x="34.0" y="300.0" text-anchor="end">5</text><text class="dr-tick" x="520.0" y="552.0" text-anchor="middle">10</text><text class="dr-tick" x="34.0" y="60.0" text-anchor="end">10</text></g><g class="dr-land" data-id="isle"><polygon class="dr-land-shape" points="232.0,248.0 328.0,248.0 328.0,152.0 232.0,152.0" fill="url(#dr-pat-land)"/><text class="dr-label dr-label-land" x="280.0" y="204.0" text-anchor="middle">Isle</text></g><g class="dr-current" data-id="z"><rect class="dr-current-zone" x="184.0" y="248.0" width="240.0" height="288.0"/><path class="dr-current-arrow" d="M282.0,386.0 L326.0,386.0 M319.0,382.2 L326.0,386.0 L319.0,389.8"/><text class="dr-label dr-label-current" x="304.0" y="408.0" text-anchor="middle">1 to 2 kn</text></g><g class="dr-hazard dr-hazard-reef" data-id="reef"><circle class="dr-hazard-shape" cx="280.0" cy="392.0" r="38.4" fill="url(#dr-pat-reef)"/><text class="dr-label dr-label-hazard" x="280.0" y="349.6" text-anchor="middle">Reef</text></g><g class="dr-hazard dr-hazard-shoal" data-id="shoal"><circle class="dr-hazard-shape" cx="184.0" cy="440.0" r="33.6" fill="url(#dr-pat-shoal)"/><text class="dr-label dr-label-hazard" x="184.0" y="402.4" text-anchor="middle">Shoal</text></g><g class="dr-landmark dr-landmark-lighthouse" data-id="lt"><path class="dr-landmark-shape" d="M131.0,159.0 L141.0,159.0 L136.0,144.0 Z"/><path class="dr-landmark-ray" d="M129.0,144.0 L124.0,142.0 M143.0,144.0 L148.0,142.0"/><text class="dr-label dr-label-landmark" x="136.0" y="174.0" text-anchor="middle">The Light</text></g><g class="dr-scale" role="img" aria-label="Scale bar, 5 nautical miles"><path class="dr-scale-bar" d="M40.0,20.0 L280.0,20.0 M40.0,15.0 L40.0,25.0 M280.0,15.0 L280.0,25.0"/><text class="dr-scale-label" x="160.0" y="36.0" text-anchor="middle">5 nm</text></g><g class="dr-wind" role="img" aria-label="Wind from 270, 10 to 15 kn"><path class="dr-wind-arrow" d="M263.0,22.0 L293.0,22.0 M286.0,18.2 L293.0,22.0 L286.0,25.8"/><text class="dr-label dr-label-wind" x="278.0" y="49.0" text-anchor="middle">Wind from 270, 10 to 15 kn</text></g><g class="dr-rose" role="img" aria-label="Compass rose, north is up"><circle class="dr-rose-ring" cx="496.0" cy="28.0" r="17.0"/><path class="dr-rose-needle" d="M496.0,11.0 L491.5,28.0 L500.5,28.0 Z"/><path class="dr-rose-tail" d="M496.0,28.0 L496.0,45.0 M479.0,28.0 L513.0,28.0"/><text class="dr-rose-letter" x="496.0" y="8.0" text-anchor="middle">N</text></g><g class="dr-start"><circle class="dr-start-ring" cx="88.0" cy="296.0" r="8"/><circle class="dr-start-dot" cx="88.0" cy="296.0" r="2.5"/><text class="dr-label dr-label-start" x="88.0" y="320.0" text-anchor="middle">Start</text></g><g class="dr-dest"><circle class="dr-arrival-ring" cx="472.0" cy="296.0" r="48.0"/><path class="dr-flag-pole" d="M472.0,296.0 L472.0,274.0"/><path class="dr-flag" d="M472.0,274.0 L487.0,279.0 L472.0,284.0 Z"/><text class="dr-label dr-label-dest" x="472.0" y="359.0" text-anchor="middle">Landfall</text></g><g class="dr-plan"><polyline class="dr-est-track" points="88.0,296.0 147.5,286.9 206.6,277.8 283.8,268.6 361.1,259.5 438.4,250.4 497.9,241.3"/><g class="dr-leg-mark"><circle cx="497.9" cy="241.3" r="8"/><text class="dr-leg-number" x="497.9" y="245.3" text-anchor="middle">1</text></g></g><g class="dr-point"><path class="dr-point-cross" d="M320.0,248.0 L336.0,248.0 M328.0,240.0 L328.0,256.0"/><text class="dr-label dr-label-point" x="339.0" y="241.0" text-anchor="start">P</text></g></svg>
