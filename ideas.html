<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script src="shared/owner-gate.js"></script>
<title>Ideas Answer Sheet</title>
<!-- Deliberately not linked from the hub nav or listed anywhere (same as admin.html).
     Reads ideas-data.json (the questions, regenerated by scripts/generate-ideas-data.py from
     the planning/IMPROVEMENT-IDEAS-ROUND-*.md docs) and, only when served from the local
     checkout, ideas-answers.local.json (the answers already typed into those docs, which is
     never committed). Answers given here are kept in this browser's localStorage AND saved to the
     owner account (GET/PUT /owner/notes/ideas-answers), so they need no exporting; "Copy answers" still
     works as a manual route. -->
<link rel="icon" href="icons/icon-192.png">
<script src="shared/theme.js"></script>
<style>
  :root {
    --bg: #0e1020; --panel: #171a2e; --panel-2: #1e2240; --line: rgba(140, 160, 255, 0.22);
    --text: #eaeaf0; --muted: #9aa1c4; --accent: #8fa6ff;
    --yes: #3f9d6a; --later: #c9963a; --no: #c25a5a; --focus: #ffd666;
  }
  :root[data-theme="light"] {
    --bg: #f3f4fa; --panel: #ffffff; --panel-2: #eef0fb; --line: rgba(60, 70, 140, 0.25);
    --text: #1b2033; --muted: #5a6182; --accent: #3b50c4;
    --yes: #1f7a4c; --later: #9a6a10; --no: #a63a3a; --focus: #b07d00;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  header.bar { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 0.6rem 1rem; display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center; }
  header.bar h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.04em; }
  header.bar label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; }
  select, input[type="search"], textarea, button { font: inherit; color: inherit; }
  select, input[type="search"] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.35rem 0.5rem; }
  input[type="search"] { width: 12rem; }
  button { cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.4rem 0.8rem; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible,
  .item:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .spacer { flex: 1; }
  #progress { font-size: 0.85rem; color: var(--muted); }
  #export-btn { background: var(--accent); color: #0b0d1c; border-color: transparent; font-weight: 600; }
  :root[data-theme="light"] #export-btn { color: #fff; }
  .layout { display: grid; grid-template-columns: 17rem 1fr; gap: 1.2rem; max-width: 1150px; margin: 0 auto; padding: 1rem; }
  nav#sections { position: sticky; top: 4.6rem; align-self: start; max-height: calc(100vh - 5.5rem); overflow: auto;
    display: flex; flex-direction: column; gap: 0.25rem; padding-right: 0.3rem; }
  nav#sections button { text-align: left; display: flex; justify-content: space-between; gap: 0.5rem; width: 100%;
    background: transparent; border-color: transparent; padding: 0.4rem 0.6rem; }
  nav#sections button[aria-current="true"] { background: var(--panel-2); border-color: var(--accent); }
  nav#sections .count { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  nav#sections .count.done { color: var(--yes); }
  .nav-group { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0.6rem 0.6rem 0.1rem; }
  main h2 { margin: 0 0 0.3rem; font-size: 1.3rem; }
  .section-note { color: var(--muted); font-size: 0.9rem; margin: 0.2rem 0 0.8rem; }
  .section-tools { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.6rem 0 1rem; font-size: 0.85rem; color: var(--muted); }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 0.7rem; }
  .item[data-state="yes"] { border-left: 4px solid var(--yes); }
  .item[data-state="later"] { border-left: 4px solid var(--later); }
  .item[data-state="no"] { border-left: 4px solid var(--no); }
  .item-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; font-size: 0.8rem; color: var(--muted); }
  .num { font-weight: 700; color: var(--text); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 0.5rem; font-size: 0.7rem; }
  .chip.big { color: var(--accent); }
  .chip.doc { color: var(--yes); }
  .group-note { background: var(--panel-2); border-radius: 8px; padding: 0.5rem 0.7rem; margin: 0 0 0.7rem; font-size: 0.85rem; color: var(--muted); }
  .text { margin: 0.35rem 0 0.7rem; }
  .item .text strong:first-child { color: var(--accent); }
  .text code { background: var(--panel-2); padding: 0 0.25rem; border-radius: 4px; font-size: 0.9em; }
  .choices { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
  .choices button[aria-pressed="true"] { color: #fff; border-color: transparent; font-weight: 600; }
  .choices button[data-c="yes"][aria-pressed="true"] { background: var(--yes); }
  .choices button[data-c="later"][aria-pressed="true"] { background: var(--later); }
  .choices button[data-c="no"][aria-pressed="true"] { background: var(--no); }
  .choices .link { background: transparent; border-color: transparent; color: var(--accent); padding-left: 0.3rem; }
  .comment { width: 100%; margin-top: 0.6rem; min-height: 4.2rem; resize: vertical; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.6rem; }
  .existing { font-size: 0.82rem; color: var(--muted); margin-top: 0.4rem; }
  .existing q { color: var(--text); }
  .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  .hint { font-size: 0.75rem; color: var(--muted); }
  #toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent);
    border-radius: 999px; padding: 0.5rem 1rem; z-index: 40; }
  #export-dialog { width: min(46rem, 94vw); background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 14px; padding: 1rem; }
  #export-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
  #export-text { width: 100%; min-height: 18rem; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.6rem; font: 0.85rem/1.45 ui-monospace, Menlo, monospace; color: var(--text); }
  .dialog-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; align-items: center; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; padding: 0.7rem; }
    nav#sections { position: static; flex-direction: row; overflow-x: auto; max-height: none; padding-bottom: 0.4rem; }
    nav#sections button { width: auto; white-space: nowrap; border-color: var(--line); }
    .nav-group { display: none; }
    input[type="search"] { width: 100%; }
    .hint { display: none; }
    header.bar { position: static; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>Ideas answer sheet</h1>
  <label>Round <select id="round-select"></select></label>
  <label>Show <select id="filter-select">
    <option value="open">Unanswered</option>
    <option value="all">Everything</option>
    <option value="answered">Already answered</option>
  </select></label>
  <label>Size <select id="tag-select">
    <option value="">All</option><option value="big">Big</option><option value="small">Small</option>
  </select></label>
  <input id="search" type="search" placeholder="Search ideas" aria-label="Search ideas">
  <span class="spacer"></span>
  <span id="progress" aria-live="polite"></span>
  <span id="sync-status" class="hint" style="display:inline" aria-live="polite"></span>
  <button id="export-btn" type="button">Copy answers (0)</button>
</header>
<div class="layout">
  <nav id="sections" aria-label="Games and sections"></nav>
  <main id="content" aria-live="polite"></main>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="export-dialog" aria-labelledby="export-title">
  <h2 id="export-title" style="margin-top:0">Your answers</h2>
  <p class="hint" style="display:block">Paste this into the chat. Only items you changed on this page are included.</p>
  <textarea id="export-text" readonly></textarea>
  <div class="dialog-row">
    <button id="copy-btn" type="button">Copy to clipboard</button>
    <button id="download-btn" type="button">Download .md</button>
    <button id="clear-btn" type="button">Clear my answers</button>
    <span class="spacer"></span>
    <button id="close-btn" type="button">Close</button>
  </div>
</dialog>

<script>
(() => {
  "use strict";
  const STORE_KEY = "ideas-sheet-v1";
  const UI_KEY = "ideas-sheet-ui-v2"; // v2: everyone lands on "All unanswered" once
  const ALL = "all-open";
  const $ = (id) => document.getElementById(id);

  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* convenience only */ } };

  let data = null;          // {rounds: [...]}
  let baseline = {};        // answers already in the docs (local checkout only)
  let mine = {};            // {roundId: {code: {n: {c, m}}}} -- what was typed on this page
  let ui = { round: ALL, section: "", filter: "open", tag: "", q: "" };
  const touched = new Set(); // "code:n" keys edited this visit, kept visible under the "unanswered" filter

  try { mine = JSON.parse(lsGet(STORE_KEY) || "{}") || {}; } catch (e) { mine = {}; }
  try { Object.assign(ui, JSON.parse(lsGet(UI_KEY) || "{}")); } catch (e) { /* defaults */ }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function md(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }

  // "All unanswered": a virtual round that gathers every section (from every round) that had at least one
  // unanswered item when the page loaded, so nothing has to be hunted for across the tabs. Its sections keep
  // pointing at the real answers through a composite code "roundId|code" (see split()).
  let allRound = null;
  function buildAll() {
    const secs = [];
    for (const r of data.rounds) {
      for (const sec of r.sections) {
        if (!sec.items.some((i) => !i.answered)) continue;
        secs.push(Object.assign({}, sec, { code: r.id + "|" + sec.code, _round: r.id, _roundTitle: r.title, _plain: sec.title, title: r.title + " \u00b7 " + sec.title }));
      }
    }
    allRound = { id: ALL, title: "All unanswered", sections: secs };
  }
  function split(code) {
    const i = String(code).indexOf("|");
    return i < 0 ? [ui.round, code] : [code.slice(0, i), code.slice(i + 1)];
  }
  const round = () => (ui.round === ALL && allRound) || data.rounds.find((r) => r.id === ui.round) || data.rounds[0];
  const section = () => round().sections.find((s) => s.code === ui.section) || round().sections[0];
  const labels = (sec) => (sec.vocab === "decide"
    ? [["yes", "Now"], ["later", "Later"], ["no", "Drop"]]
    : sec.vocab === "recommend"
      ? [["yes", "Go with the recommendation"], ["later", "Later"], ["no", "Not that"]]
      : [["yes", "Yes"], ["later", "Later"], ["no", "No"]]);
  const words = (sec) => (sec.vocab === "decide" ? { yes: "now", later: "later", no: "drop" } : { yes: "yes", later: "later", no: "no" });
  const isQuestions = (sec) => /open questions/i.test(sec.title) || sec.vocab === "recommend" || sec.vocab === "survey";
  const isSurvey = (sec) => sec.vocab === "survey"; // free-text only: no yes/later/no buttons, answered = text typed

  function mineFor(code, n) { const [r, c] = split(code); return ((mine[r] || {})[c] || {})[n]; }
  function baseFor(code, n) { const [r, c] = split(code); return ((baseline[r] || {})[c] || {})[n]; }
  function effective(code, item) {
    const m = mineFor(code, item.n);
    if (m) return m;
    const b = baseFor(code, item.n);
    return b ? { c: b.c, m: b.m } : null;
  }
  function isOpen(code, item) {
    const m = mineFor(code, item.n);
    if (m && m.c) return false;
    if (sectionIsSurvey(code)) return !((effective(code, item) || {}).m);
    return !item.answered;
  }
  function sectionIsSurvey(code) {
    const [rid, real] = split(code);
    const r = data.rounds.find((x) => x.id === rid);
    const sec = r && r.sections.find((x) => x.code === real);
    return Boolean(sec && sec.vocab === "survey");
  }
  function setMine(code, n, patch) {
    const [rid, realCode] = split(code);
    const r = (mine[rid] = mine[rid] || {});
    const s = (r[realCode] = r[realCode] || {});
    const cur = s[n] || { c: (baseFor(code, n) || {}).c || "", m: (baseFor(code, n) || {}).m || "" };
    const next = Object.assign({}, cur, patch, { u: Date.now() });
    if (!next.c && !next.m && !baseFor(code, n)) delete s[n]; else s[n] = next;
    if (!Object.keys(s).length) delete r[realCode];
    lsSet(STORE_KEY, JSON.stringify(mine));
    touched.add(code + ":" + n);
    schedulePush();
  }

  // ---- sync to the account ---------------------------------------------------------
  // Answers are saved to the owner account (PUT /owner/notes/ideas-answers) as you go, so they
  // do not have to be exported: the assistant reads the same copy, and a second device sees it.
  // Per item, the newer edit wins on merge. The browser copy stays the source of truth if the
  // server cannot be reached; "Copy answers" still works either way.
  const API = "https://noyvjgames.fastapicloud.dev";
  const NOTE_URL = API + "/owner/notes/ideas-answers";
  let pushTimer = null;
  function authHeaders() {
    let token = null;
    try { token = localStorage.getItem("hub_bearer_token"); } catch (e) { token = null; }
    return token ? { Authorization: "Bearer " + token, "Content-Type": "application/json" } : null;
  }
  function setSync(text) { const el = $("sync-status"); if (el) el.textContent = text; }
  function clock() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function schedulePush() {
    setSync("Saving\u2026");
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 1200);
  }
  async function push() {
    const headers = authHeaders();
    if (!headers) { setSync("Not synced: sign in on the hub"); return; }
    try {
      const res = await fetch(NOTE_URL, { method: "PUT", headers, body: JSON.stringify({ value: { version: 1, answers: mine } }) });
      if (res.ok) setSync("Saved to your account at " + clock());
      else if (res.status === 404) setSync("Not synced: the backend needs its latest deploy");
      else setSync("Not synced (" + res.status + "), kept in this browser");
    } catch (e) { setSync("Not synced (offline), kept in this browser"); }
  }
  function mergeInto(local, remote) {
    let changed = false;
    for (const [round, codes] of Object.entries(remote || {})) {
      for (const [code, items] of Object.entries(codes || {})) {
        for (const [n, theirs] of Object.entries(items || {})) {
          const mineItem = ((local[round] || {})[code] || {})[n];
          if (!mineItem || (theirs.u || 0) > (mineItem.u || 0)) {
            ((local[round] = local[round] || {})[code] = local[round][code] || {})[n] = theirs;
            changed = true;
          }
        }
      }
    }
    return changed;
  }
  async function pull() {
    const headers = authHeaders();
    if (!headers) { setSync("Not synced: sign in on the hub"); return; }
    try {
      const res = await fetch(NOTE_URL, { headers, cache: "no-store" });
      if (res.status === 404) { setSync("Not synced: the backend needs its latest deploy"); return; }
      if (!res.ok) { setSync("Not synced (" + res.status + "), kept in this browser"); return; }
      const body = await res.json();
      const remote = body.value && body.value.answers;
      const changed = remote ? mergeInto(mine, remote) : false;
      if (changed) { lsSet(STORE_KEY, JSON.stringify(mine)); render(); }
      // Push when this browser holds anything the server lacks (or the server is empty).
      await push();
    } catch (e) { setSync("Not synced (offline), kept in this browser"); }
  }

  function changedCount() {
    let n = 0;
    for (const r of Object.values(mine)) for (const s of Object.values(r)) n += Object.keys(s).length;
    return n;
  }

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200);
  }

  // ---- rendering -------------------------------------------------------
  function navButton(s, label) {
    const open = s.items.filter((i) => isOpen(s.code, i)).length;
    const b = document.createElement("button"); b.type = "button";
    b.dataset.code = s.code;
    if (s.code === ui.section) b.setAttribute("aria-current", "true");
    const name = document.createElement("span"); name.textContent = label;
    const count = document.createElement("span"); count.className = "count" + (open === 0 ? " done" : "");
    count.textContent = open === 0 ? "done" : open + " open";
    b.append(name, count);
    b.addEventListener("click", () => { ui.section = s.code; saveUi(); render(); window.scrollTo({ top: 0 }); });
    return b;
  }
  function renderNav() {
    const nav = $("sections"); nav.textContent = "";
    const secs = round().sections;
    if (ui.round === ALL) {
      for (const r of data.rounds) {
        // Tabs whose items are all answered are hidden here (the one being worked in stays until you leave it).
        const list = secs.filter((s) => s._round === r.id &&
          (s.code === ui.section || s.items.some((i) => isOpen(s.code, i))));
        if (!list.length) continue;
        const g = document.createElement("div"); g.className = "nav-group"; g.textContent = r.title; nav.appendChild(g);
        for (const s of list) nav.appendChild(navButton(s, s._plain));
      }
      return;
    }
    const games = secs.filter((s) => /gamified/.test(s.title) || /^[A-L]$/.test(s.code) || /^G[B-I]$/.test(s.code));
    const others = secs.filter((s) => !games.includes(s));
    const add = (list, label) => {
      if (label && list.length) { const g = document.createElement("div"); g.className = "nav-group"; g.textContent = label; nav.appendChild(g); }
      for (const s of list) nav.appendChild(navButton(s, s.title));
    };
    add(games, "Games");
    add(others, "Everything else");
  }

  function visible(sec, item) {
    const key = sec.code + ":" + item.n;
    if (ui.filter === "open" && !(isOpen(sec.code, item) || touched.has(key))) return false;
    if (ui.filter === "answered" && isOpen(sec.code, item) && !touched.has(key)) return false;
    if (ui.tag && item.tag !== ui.tag) return false;
    if (ui.q && !(item.text + " " + (item.group || "")).toLowerCase().includes(ui.q.toLowerCase())) return false;
    return true;
  }

  function renderItem(sec, item) {
    const key = sec.code + ":" + item.n;
    const eff = effective(sec.code, item);
    const art = document.createElement("article");
    art.className = "item"; art.tabIndex = 0; art.dataset.key = key; art.dataset.n = item.n;
    art.dataset.state = (eff && eff.c) || "";
    if (item.group) {
      const g = document.createElement("div"); g.className = "group-note"; g.innerHTML = md(item.group); art.appendChild(g);
    }
    const head = document.createElement("div"); head.className = "item-head";
    head.innerHTML = '<span class="num">' + item.n + "</span>" +
      (item.tag ? '<span class="chip ' + item.tag + '">' + item.tag.toUpperCase() + "</span>" : "");
    if (item.answered && !mineFor(sec.code, item.n)) head.insertAdjacentHTML("beforeend", '<span class="chip doc">answered in the doc</span>');
    art.appendChild(head);
    const text = document.createElement("p"); text.className = "text"; text.innerHTML = md(item.text); art.appendChild(text);

    const choices = document.createElement("div"); choices.className = "choices";
    choices.setAttribute("role", "group"); choices.setAttribute("aria-label", "Answer for item " + item.n);
    for (const [c, label] of (isSurvey(sec) ? [] : labels(sec))) {
      const b = document.createElement("button"); b.type = "button"; b.dataset.c = c; b.textContent = label;
      b.setAttribute("aria-pressed", String(Boolean(eff && eff.c === c)));
      b.addEventListener("click", () => choose(sec, item, c));
      choices.appendChild(b);
    }
    const cm = document.createElement("button"); cm.type = "button"; cm.className = "link";
    const hasComment = Boolean(eff && eff.m);
    cm.textContent = hasComment ? "Edit comment" : "+ Add comment";
    if (!isSurvey(sec)) { choices.appendChild(cm); art.appendChild(choices); }

    const ta = document.createElement("textarea"); ta.className = "comment"; ta.setAttribute("aria-label", "Comment on item " + item.n);
    ta.placeholder = isSurvey(sec) ? "Type your answer (skip anything you like)…" : "Anything you want to add…";
    ta.value = (eff && eff.m) || "";
    ta.hidden = !(hasComment || isQuestions(sec));
    ta.addEventListener("input", () => { setMine(sec.code, item.n, { m: ta.value.trim() }); updateChrome(); });
    cm.addEventListener("click", () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); });
    art.appendChild(ta);

    if (item.answered && !mineFor(sec.code, item.n) && !baseFor(sec.code, item.n)) {
      // The docs hold an answer but its text is not available here (live site): pointer only.
    } else if (baseFor(sec.code, item.n) && mineFor(sec.code, item.n)) {
      const old = baseFor(sec.code, item.n);
      const ex = document.createElement("div"); ex.className = "existing";
      ex.innerHTML = "In the doc: <q>" + esc(old.raw) + "</q>"; art.appendChild(ex);
    }
    return art;
  }

  function choose(sec, item, c) {
    const eff = effective(sec.code, item);
    const next = eff && eff.c === c ? "" : c; // clicking the active answer clears it
    setMine(sec.code, item.n, { c: next });
    const art = document.querySelector('[data-key="' + sec.code + ":" + item.n + '"]');
    if (art) {
      art.dataset.state = next;
      art.querySelectorAll(".choices button[data-c]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === next)));
    }
    updateChrome();
  }

  function renderMain() {
    const sec = section(), main = $("content"); main.textContent = "";
    const h = document.createElement("h2"); h.textContent = sec.title; main.appendChild(h);
    const note = sec.intro;
    if (note) { const p = document.createElement("p"); p.className = "section-note"; p.innerHTML = md(note); main.appendChild(p); }
    const items = sec.items.filter((i) => visible(sec, i));
    const tools = document.createElement("div"); tools.className = "section-tools";
    const openN = sec.items.filter((i) => isOpen(sec.code, i)).length;
    tools.append(document.createTextNode(items.length + " shown · " + openN + " unanswered"));
    if (openN) {
      for (const [c, label] of labels(sec)) {
        const b = document.createElement("button"); b.type = "button";
        b.textContent = "Mark all unanswered: " + label;
        b.addEventListener("click", () => {
          if (!confirm("Set every unanswered item in " + sec.title + " to \"" + label + "\"? You can still change any of them afterwards.")) return;
          for (const i of sec.items) if (isOpen(sec.code, i)) setMine(sec.code, i.n, { c });
          render();
        });
        tools.appendChild(b);
      }
    }
    const hint = document.createElement("span"); hint.className = "hint";
    hint.textContent = "Keys on a focused card: Y / L / N answer and move on, C comment, J / K next / previous.";
    tools.appendChild(hint);
    main.appendChild(tools);
    if (!items.length) {
      const e = document.createElement("p"); e.className = "empty";
      e.textContent = ui.filter === "open" ? "Nothing left unanswered here." : "Nothing matches this filter.";
      main.appendChild(e);
    }
    for (const i of items) main.appendChild(renderItem(sec, i));
    if (sec.notes) { const p = document.createElement("p"); p.className = "section-note"; p.innerHTML = md(sec.notes); main.appendChild(p); }
  }

  function updateChrome() {
    const all = round().sections.flatMap((s) => s.items.map((i) => [s, i]));
    const open = all.filter(([s, i]) => isOpen(s.code, i)).length;
    $("progress").textContent = (all.length - open) + " / " + all.length + " answered";
    $("export-btn").textContent = "Copy answers (" + changedCount() + ")";
    renderNavCounts();
  }
  function renderNavCounts() {
    document.querySelectorAll("#sections button[data-code]").forEach((b) => {
      const s = round().sections.find((x) => x.code === b.dataset.code); if (!s) return;
      const open = s.items.filter((i) => isOpen(s.code, i)).length;
      const c = b.querySelector(".count"); c.textContent = open === 0 ? "done" : open + " open"; c.classList.toggle("done", open === 0);
    });
  }

  function saveUi() { lsSet(UI_KEY, JSON.stringify(ui)); }
  function render() { renderNav(); renderMain(); updateChrome(); }

  // ---- export ----------------------------------------------------------
  function buildExport() {
    if (ui.round !== ALL) return exportRound(round(), ui.round);
    return data.rounds.map((r) => exportRound(r, r.id)).filter(Boolean).join("\n");
  }
  function exportRound(rnd, rid) {
    const lines = ["## " + rnd.title + " answers (from the ideas page, " + new Date().toISOString().slice(0, 10) + ")", ""];
    let any = false;
    for (const sec of rnd.sections) {
      const mine_s = (mine[rid] || {})[sec.code]; if (!mine_s) continue;
      const w = words(sec), rows = [];
      for (const item of sec.items) {
        const m = mine_s[item.n]; if (!m || (!m.c && !m.m)) continue;
        const verdict = m.c ? w[m.c] : "";
        const comment = (m.m || "").replace(/\s*\n+\s*/g, " / ");
        rows.push(item.n + ". " + (verdict && comment ? verdict + " — " + comment : verdict || "(comment) " + comment));
      }
      if (!rows.length) continue;
      any = true;
      lines.push("### " + sec.code + " — " + sec.title, ...rows, "");
    }
    return any ? lines.join("\n") : "";
  }
  function openExport() {
    const text = buildExport();
    if (!text) { toast("Nothing answered on this page yet."); return; }
    $("export-text").value = text;
    $("export-dialog").showModal();
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
    const ta = $("export-text"); ta.select();
    try { return document.execCommand("copy"); } catch (e) { return false; }
  }

  // ---- keyboard --------------------------------------------------------
  function focusSibling(art, dir) {
    const list = [...document.querySelectorAll("#content .item")];
    const next = list[list.indexOf(art) + dir];
    if (next) { next.focus(); next.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (!t.classList || !t.classList.contains("item")) return;
    const sec = section(), item = sec.items.find((i) => String(i.n) === t.dataset.n);
    const k = e.key.toLowerCase();
    const map = { y: "yes", l: "later", n: "no" };
    if (map[k]) { e.preventDefault(); choose(sec, item, map[k]); focusSibling(t, 1); }
    else if (k === "c") { e.preventDefault(); const ta = t.querySelector("textarea"); ta.hidden = false; ta.focus(); }
    else if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); focusSibling(t, 1); }
    else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); focusSibling(t, -1); }
  });

  // ---- boot ------------------------------------------------------------
  function wire() {
    const rs = $("round-select");
    buildAll();
    const first = document.createElement("option"); first.value = ALL; first.textContent = "All unanswered (everything, every file)"; rs.appendChild(first);
    for (const r of data.rounds) { const o = document.createElement("option"); o.value = r.id; o.textContent = r.title; rs.appendChild(o); }
    if (ui.round !== ALL && !data.rounds.some((r) => r.id === ui.round)) ui.round = ALL;
    rs.value = ui.round;
    rs.addEventListener("change", () => { ui.round = rs.value; ui.section = ""; touched.clear(); pickSection(); saveUi(); render(); });
    $("filter-select").value = ui.filter;
    $("filter-select").addEventListener("change", (e) => { ui.filter = e.target.value; saveUi(); renderMain(); });
    $("tag-select").value = ui.tag;
    $("tag-select").addEventListener("change", (e) => { ui.tag = e.target.value; saveUi(); renderMain(); });
    $("search").value = ui.q;
    $("search").addEventListener("input", (e) => { ui.q = e.target.value; saveUi(); renderMain(); });
    $("export-btn").addEventListener("click", openExport);
    $("close-btn").addEventListener("click", () => $("export-dialog").close());
    $("copy-btn").addEventListener("click", async () => toast((await copyText($("export-text").value)) ? "Copied. Paste it into the chat." : "Copy failed: select the text and copy it by hand."));
    $("download-btn").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([$("export-text").value], { type: "text/markdown" }));
      a.download = "ideas-answers-" + new Date().toISOString().slice(0, 10) + ".md"; a.click(); URL.revokeObjectURL(a.href);
    });
    $("clear-btn").addEventListener("click", () => {
      if (!confirm("Delete every answer you typed on this page, including the copy saved to your account (not the ones in the docs)?")) return;
      mine = {}; lsSet(STORE_KEY, "{}"); touched.clear(); $("export-dialog").close(); render(); toast("Cleared.");
      schedulePush();
    });
    // Cross-tab safety: another tab answering the same sheet should not be silently overwritten.
    window.addEventListener("storage", (e) => { if (e.key === STORE_KEY) { try { mine = JSON.parse(e.newValue || "{}") || {}; } catch (x) { mine = {}; } render(); } });
  }
  function pickSection() {
    const secs = round().sections;
    if (secs.some((s) => s.code === ui.section)) return;
    const first = secs.find((s) => s.items.some((i) => isOpen(s.code, i))) || secs[0];
    ui.section = first.code;
  }

  async function load() {
    try {
      data = await (await fetch("ideas-data.json", { cache: "no-cache" })).json();
    } catch (e) {
      $("content").textContent = "Could not load ideas-data.json. Run scripts/generate-ideas-data.py and reload.";
      return;
    }
    try {
      const r = await fetch("ideas-answers.local.json", { cache: "no-cache" });
      if (r.ok) baseline = await r.json();
    } catch (e) { /* not available on the public site, and that is fine */ }
    wire(); pickSection(); render();
    pull();
  }
  load();
})();
</script>
</body>
</html>
