<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#whats-new-main">Skip to content</a>
  <div class="space-bg" aria-hidden="true"><div class="space-bg-nebula"></div><div class="space-bg-stars-bright"></div></div>
  <header id="hub-header">
    <nav class="hub-nav">
      <a href="index.html">&larr; Back to NoyvjGames</a>
      <a href="achievements.html">Achievements</a>
      <a href="roadmap.html">Roadmap</a>

      <a href="index.html#site-feedback-section">Feedback / Report a Bug</a>
    </nav>
    <h1>What's New</h1>
    <p id="hub-tagline">A running record of updates across the hub and every game — pulled straight from the site's own dev logs.</p>
  </header>

  <main id="whats-new-main" tabindex="-1" class="whats-new-main">
    <p id="whats-new-status" class="whats-new-status">Loading update history&hellip;</p>
    <div id="whats-new-list" class="whats-new-list"></div>
  </main>

  <script>
    // Pulls its content straight from BCM114-DEV-LOG.md (individual game
    // content) and BCM206-DEV-LOG.md (site infrastructure) at load time,
    // rather than being hand-written or regenerated by a build step — this
    // site has no build step, and a dev log entry appended by any future
    // session shows up here automatically on next load. Scoped deliberately
    // per the TODO item: brief one-line bullets + date only, grouped and
    // collapsible per date (some days have many entries logged at once) —
    // never the full entry text, and never a direct link into the log file
    // itself.
    const LOG_SOURCES = [
      { path: "BCM114-DEV-LOG.md", label: "Game content" },
      { path: "BCM206-DEV-LOG.md", label: "Site infrastructure" },
    ];

    // Every dev log entry (see the "Instructions for Claude Code" section
    // atop each log file) starts with "### YYYY-MM-DD" and always includes
    // a "**Did:** ..." line — BCM114 entries also carry "**Game:** ...",
    // BCM206 entries "**Touched:** ...". Only date + a trimmed one-line
    // slice of "Did" is surfaced here, per the scoping note above.
    function parseLogEntries(text, label) {
      const entries = [];
      const blocks = text.split(/\n(?=### \d{4}-\d{2}-\d{2})/);
      blocks.forEach((block) => {
        const dateMatch = block.match(/^### (\d{4}-\d{2}-\d{2})/);
        const didMatch = block.match(/\*\*Did:\*\*\s*([\s\S]*?)(?:\n\*\*|\n---|\n##|$)/);
        if (!dateMatch || !didMatch) return;
        const gameMatch = block.match(/\*\*Game:\*\*\s*(.+)/);
        const oneLine = didMatch[1].replace(/\s+/g, " ").trim();
        entries.push({
          date: dateMatch[1],
          label,
          game: gameMatch ? gameMatch[1].trim() : null,
          summary: truncate(oneLine, 180),
        });
      });
      return entries;
    }

    function truncate(text, maxLength) {
      if (text.length <= maxLength) return text;
      const cut = text.slice(0, maxLength);
      const lastSpace = cut.lastIndexOf(" ");
      return `${cut.slice(0, lastSpace > 0 ? lastSpace : maxLength)}…`;
    }

    function groupByDate(entries) {
      const byDate = new Map();
      entries.forEach((entry) => {
        if (!byDate.has(entry.date)) byDate.set(entry.date, []);
        byDate.get(entry.date).push(entry);
      });
      return [...byDate.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1));
    }

    function renderWhatsNew(groupedDates) {
      const list = document.getElementById("whats-new-list");
      const status = document.getElementById("whats-new-status");
      list.innerHTML = "";
      if (!groupedDates.length) {
        status.textContent = "No update history yet.";
        return;
      }
      status.remove();
      // Y10: remember the newest date seen, so the hub's nav badge can count
      // only entries newer than this on the visitor's next visit.
      try { localStorage.setItem("hub_whats_new_seen", groupedDates[0][0]); } catch (err) { /* convenience only */ }
      groupedDates.forEach(([date, entries], i) => {
        const details = document.createElement("details");
        details.className = "whats-new-date-group";
        if (i < 2) details.open = true; // most recent couple of dates open by default
        const summary = document.createElement("summary");
        summary.textContent = `${date} (${entries.length} update${entries.length === 1 ? "" : "s"})`;
        details.appendChild(summary);
        const ul = document.createElement("ul");
        ul.className = "whats-new-entry-list";
        entries.forEach((entry) => {
          const li = document.createElement("li");
          const tag = document.createElement("span");
          tag.className = "whats-new-entry-tag";
          tag.textContent = entry.game ? `${entry.label} — ${entry.game}` : entry.label;
          const text = document.createElement("span");
          text.className = "whats-new-entry-text";
          text.textContent = entry.summary;
          li.appendChild(tag);
          li.appendChild(text);
          ul.appendChild(li);
        });
        details.appendChild(ul);
        list.appendChild(details);
      });
    }

    async function loadWhatsNew() {
      try {
        const results = await Promise.all(
          LOG_SOURCES.map(async (source) => {
            const res = await fetch(source.path);
            if (!res.ok) throw new Error(`status ${res.status}`);
            const text = await res.text();
            return parseLogEntries(text, source.label);
          })
        );
        renderWhatsNew(groupByDate(results.flat()));
      } catch (err) {
        console.error("loadWhatsNew failed:", err);
        document.getElementById("whats-new-status").textContent =
          "Couldn't load update history right now.";
      }
    }

    loadWhatsNew();
  </script>
</body>
</html>
