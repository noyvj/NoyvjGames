<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New — NoyvjGames</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/space-bg.css">
<link rel="stylesheet" href="style.css">
<script src="hub-prefs.js"></script>
<script src="shared/theme.js"></script>
<script src="shared/lite-mode.js"></script>
<script src="shared/site-settings.js"></script>

<link rel="stylesheet" href="shared/lite-mode.css">
</head>
<body>
  <a class="skip-link" href="#whats-new-main">Skip to content</a>
  <div class="space-bg" aria-hidden="true"><div class="space-bg-nebula"></div><div class="space-bg-stars-bright"></div></div>
  <header id="hub-header">
    <nav class="hub-nav">
      <a href="index.html">&larr; Back to NoyvjGames</a>
      <a href="achievements.html">Achievements</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="sources.html">Sources &amp; Credits</a>
      <a href="index.html#site-feedback-section">Feedback / Report a Bug</a>
      <button type="button" class="hub-nav-button theme-toggle">Theme</button>
    </nav>
    <h1>What's New</h1>
    <p id="hub-tagline">A running record of updates across the hub and every game — pulled straight from the site's own dev logs.</p>
  </header>

  <main id="whats-new-main" tabindex="-1" class="whats-new-main">
    <p id="whats-new-status" class="whats-new-status">Loading update history&hellip;</p>
    <div id="whats-new-list" class="whats-new-list"></div>
  </main>

  <script src="whats-new-data.js"></script>
  <script>
    // The feed is built live from the two dev logs (see whats-new-data.js for the parsing and the stable
    // entry ids): there is no build step, and an entry appended to a log shows up on the next load. Brief
    // one-line bullets + date only, grouped and collapsible per date, never the full entry text.
    const VOTE_API = "https://noyvjgames.fastapicloud.dev";
    const VOTES_KEY = "hub_whats_new_votes";        // { entryId: true | false } -- this browser's own answers
    const VOTE_TOKEN_KEY = "whats-new-vote-token";   // random, made up here, identifies nothing

    function lsGet(key) { try { return localStorage.getItem(key); } catch (err) { return null; } }
    function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (err) { /* convenience only */ } }

    function readVotes() {
      try {
        const parsed = JSON.parse(lsGet(VOTES_KEY) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (err) { return {}; }
    }
    function writeVote(entryId, value) {
      const votes = readVotes();
      if (value === null) delete votes[entryId]; else votes[entryId] = value;
      lsSet(VOTES_KEY, JSON.stringify(votes));
    }
    function voteToken() {
      let token = lsGet(VOTE_TOKEN_KEY);
      if (!token || !/^[A-Za-z0-9_-]{16,64}$/.test(token)) {
        const bytes = new Uint8Array(18);
        (window.crypto || { getRandomValues(a) { for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); } }).getRandomValues(bytes);
        token = Array.from(bytes, (b) => b.toString(36).padStart(2, "0")).join("").slice(0, 36);
        lsSet(VOTE_TOKEN_KEY, token);
      }
      return token;
    }
    function voteHeaders() {
      const headers = { "Content-Type": "application/json", "X-Vote-Token": voteToken() };
      const bearer = lsGet("hub_bearer_token");
      if (bearer) headers.Authorization = `Bearer ${bearer}`;
      return headers;
    }

    // Sends the vote (or takes it back when the same thumb is pressed twice). Resolves true on success.
    async function sendVote(entryId, value) {
      try {
        const res = value === null
          ? await fetch(`${VOTE_API}/whats-new/votes/${entryId}`, { method: "DELETE", headers: voteHeaders() })
          : await fetch(`${VOTE_API}/whats-new/votes/${entryId}`, { method: "PUT", headers: voteHeaders(), body: JSON.stringify({ helpful: value }) });
        return res.ok;
      } catch (err) { return false; }
    }

    const THUMB_PATH = "M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z";

    function thumbButton(up) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "whats-new-thumb";
      button.dataset.value = up ? "up" : "down";
      button.setAttribute("aria-label", up ? "Yes, this was helpful" : "No, this was not helpful");
      button.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"${up ? "" : ' style="transform: rotate(180deg)"'}><path fill="currentColor" d="${THUMB_PATH}"/></svg>`;
      return button;
    }

    function buildVoteRow(entry) {
      const row = document.createElement("div");
      row.className = "whats-new-vote";
      const question = document.createElement("span");
      question.className = "whats-new-vote-q";
      question.textContent = "Was this helpful?";
      const up = thumbButton(true);
      const down = thumbButton(false);
      const note = document.createElement("span");
      note.className = "whats-new-vote-note";
      note.setAttribute("role", "status");
      row.append(question, up, down, note);

      function paint() {
        const current = readVotes()[entry.id];
        up.setAttribute("aria-pressed", String(current === true));
        down.setAttribute("aria-pressed", String(current === false));
      }
      async function choose(value) {
        const before = readVotes()[entry.id];
        const next = before === value ? null : value; // pressing the chosen thumb again takes the vote back
        up.disabled = down.disabled = true;
        note.textContent = "";
        const ok = await sendVote(entry.id, next);
        up.disabled = down.disabled = false;
        if (ok) {
          writeVote(entry.id, next);
          note.textContent = next === null ? "Vote removed." : "Thanks!";
        } else {
          note.textContent = "Couldn't save your vote right now.";
        }
        paint();
      }
      up.addEventListener("click", () => choose(true));
      down.addEventListener("click", () => choose(false));
      paint();
      return row;
    }

    function renderWhatsNew(groupedDates) {
      const list = document.getElementById("whats-new-list");
      const status = document.getElementById("whats-new-status");
      list.innerHTML = "";
      if (!groupedDates.length) {
        status.textContent = "No update history yet.";
        return;
      }
      status.remove();
      // Y10: remember the newest date seen, so the hub's nav badge can count
      // only entries newer than this on the visitor's next visit.
      lsSet("hub_whats_new_seen", groupedDates[0][0]);
      groupedDates.forEach(([date, entries], i) => {
        const details = document.createElement("details");
        details.className = "whats-new-date-group";
        if (i < 2) details.open = true; // most recent couple of dates open by default
        const summary = document.createElement("summary");
        summary.textContent = `${date} (${entries.length} update${entries.length === 1 ? "" : "s"})`;
        details.appendChild(summary);
        const ul = document.createElement("ul");
        ul.className = "whats-new-entry-list";
        entries.forEach((entry) => {
          const li = document.createElement("li");
          const tag = document.createElement("span");
          tag.className = "whats-new-entry-tag";
          tag.textContent = entry.game ? `${entry.label} \u2014 ${entry.game}` : entry.label;
          const text = document.createElement("span");
          text.className = "whats-new-entry-text";
          text.textContent = entry.summary;
          li.appendChild(tag);
          li.appendChild(text);
          li.appendChild(buildVoteRow(entry));
          ul.appendChild(li);
        });
        details.appendChild(ul);
        list.appendChild(details);
      });
    }

    async function loadWhatsNew() {
      try {
        renderWhatsNew(window.WhatsNewData.groupByDate(await window.WhatsNewData.loadEntries()));
      } catch (err) {
        console.error("loadWhatsNew failed:", err);
        document.getElementById("whats-new-status").textContent =
          "Couldn't load update history right now.";
      }
    }

    loadWhatsNew();
  </script>
  <script src="hub-shortcuts.js"></script>
</body>
</html>
