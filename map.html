<style>
  .map-main { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 3rem; box-sizing: border-box; }
  .map-summary { font-size: 1rem; margin: 0.5rem 0; }
  .map-note { font-size: 0.85rem; opacity: 0.8; margin: 0.3rem 0 1rem; }
  .map-controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin: 0.6rem 0 1rem; }
  .map-controls button { width: auto; min-height: 44px; padding: 0.6rem 1rem; font-size: 0.9rem; }
  .map-controls button[aria-pressed="true"] { border-color: #ffd866; box-shadow: inset 0 0 0 1px #ffd866; }
  .map-next { margin: 0.4rem 0 1rem; font-size: 0.9rem; }
  .map-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.8rem; }
  .map-node { background: rgba(14, 16, 28, 0.7); border: 1px solid rgba(140, 160, 255, 0.18); border-radius: 12px; padding: 0.7rem 0.8rem; box-sizing: border-box; }
  .map-node[data-complete="true"] { border-width: 2px; border-color: #ffd866; }
  .map-node summary { display: flex; gap: 0.7rem; align-items: center; cursor: pointer; min-height: 44px; list-style: none; }
  .map-node summary::-webkit-details-marker { display: none; }
  .map-ring { flex: none; width: 56px; height: 56px; }
  .map-ring-track { fill: none; stroke: rgba(140, 160, 255, 0.25); stroke-width: 6; }
  .map-ring-fill { fill: none; stroke: #6f8fe0; stroke-width: 6; stroke-linecap: butt; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .map-node[data-complete="true"] .map-ring-fill { stroke: #ffd866; }
  .map-ring-text { font-size: 13px; font-weight: 700; fill: currentColor; text-anchor: middle; dominant-baseline: central; }
  .map-node-name { font-weight: 700; display: block; }
  .map-node-count { font-size: 0.85rem; opacity: 0.85; display: block; }
  .map-left { margin: 0.6rem 0 0.2rem; padding: 0 0 0 1.1rem; font-size: 0.85rem; }
  .map-left li { margin: 0.25rem 0; }
  .map-left .map-left-desc { opacity: 0.8; }
  .map-play { display: inline-block; margin-top: 0.4rem; font-size: 0.85rem; }
  html[data-theme="light"] .map-node { background: rgba(255, 255, 255, 0.92); border-color: rgba(60, 85, 160, 0.4); }
  html[data-theme="light"] .map-ring-track { stroke: rgba(60, 85, 160, 0.25); }
  html[data-theme="light"] .map-ring-fill { stroke: #34509a; }
  html[data-theme="light"] .map-node[data-complete="true"] { border-color: #8a5a00; }
  html[data-theme="light"] .map-node[data-complete="true"] .map-ring-fill { stroke: #8a5a00; }
  html[data-theme="light"] .map-controls button[aria-pressed="true"] { border-color: #8a5a00; box-shadow: inset 0 0 0 1px #8a5a00; }
  @media (max-width: 480px) { .map-main { padding: 0 1rem 2rem; } }
</style>

<body>
  <a class="skip-link" href="#map-main">Skip to content</a>
  <div class="space-bg" aria-hidden="true"><div class="space-bg-nebula"></div><div class="space-bg-stars-bright"></div></div>
  <header id="hub-header">
    <nav class="hub-nav">
      <a href="index.html">&larr; Back to NoyvjGames</a>

      <a href="index.html#site-feedback-section">Feedback / Report a Bug</a>
      <button type="button" class="hub-nav-button theme-toggle">Theme</button>
    </nav>
    <h1>100% map</h1>
    <p id="hub-tagline">Every game as a ring that fills as you earn its achievements, and a plain list of what is left.</p>
  </header>

  <main id="map-main" tabindex="-1" class="map-main">
    <p id="map-summary" class="map-summary" role="status">Loading the map&hellip;</p>
    <p id="map-note" class="map-note"></p>
    <div id="map-controls" class="map-controls" hidden>
      <span>Order:</span>
      <button type="button" class="secondary" data-order="hub" aria-pressed="true">Hub order</button>
      <button type="button" class="secondary" data-order="close" aria-pressed="false">Closest to finished</button>
    </div>
    <p id="map-next" class="map-next" hidden></p>
    <ul id="map-grid" class="map-grid"></ul>
  </main>

  <script src="shared/hub-auth.js"></script>
  <script src="hub-games.js"></script>
  <script>
    (function () {
      "use strict";
      const API_BASE = "https://noyvjgames.fastapicloud.dev";
      const RING = 2 * Math.PI * 25;
      const summaryEl = document.getElementById("map-summary");
      const noteEl = document.getElementById("map-note");
      const controlsEl = document.getElementById("map-controls");
      const nextEl = document.getElementById("map-next");
      const gridEl = document.getElementById("map-grid");
      let nodes = [];
      let order = "hub";

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }
      async function fetchJson(url, options) {
        try {
          const res = await fetch(url, options);
          return res.ok ? await res.json() : null;
        } catch (e) {
          return null;
        }
      }
      function svgEl(tag, attrs) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.keys(attrs || {}).forEach((k) => node.setAttribute(k, attrs[k]));
        return node;
      }

      // Earned ids per game from the most recent save of each game on the signed-in account (the same rule
      // the hub dashboard uses). null = signed out or the list could not be read.
      async function loadEarned() {
        const token = typeof hubGetBearerToken === "function" ? hubGetBearerToken() : null;
        if (!token) return null;
        const saves = await fetchJson(API_BASE + "/users/me/saves", { headers: { Authorization: "Bearer " + token } });
        if (!Array.isArray(saves)) return null;
        const best = {};
        saves.forEach((s) => {
          const t = new Date(s.updated_at || s.created_at).getTime() || 0;
          if (!best[s.game_id] || t > best[s.game_id].t) best[s.game_id] = { t, save: s };
        });
        const out = {};
        Object.keys(best).forEach((id) => {
          const data = best[id].save.save_data;
          out[id] = data && Array.isArray(data.achievements_earned) ? data.achievements_earned : [];
        });
        return out;
      }

      function ring(pct, label) {
        const svg = svgEl("svg", { class: "map-ring", viewBox: "0 0 60 60", role: "img", "aria-label": label });
        svg.appendChild(svgEl("circle", { class: "map-ring-track", cx: 30, cy: 30, r: 25 }));
        svg.appendChild(svgEl("circle", {
          class: "map-ring-fill", cx: 30, cy: 30, r: 25,
          "stroke-dasharray": (RING * pct / 100).toFixed(2) + " " + RING.toFixed(2),
        }));
        const text = svgEl("text", { class: "map-ring-text", x: 30, y: 30 });
        text.textContent = pct >= 100 ? "✓" : pct + "%";
        svg.appendChild(text);
        return svg;
      }

      function renderNode(n) {
        const li = el("li");
        const details = el("details", "map-node");
        details.dataset.complete = n.complete ? "true" : "false";
        details.id = n.slug;
        const summary = el("summary");
        summary.appendChild(ring(n.pct, n.name + ": " + n.earned + " of " + n.total + " achievements"));
        const text = el("span");
        text.appendChild(el("span", "map-node-name", n.name));
        text.appendChild(el("span", "map-node-count", n.complete
          ? "Complete: " + n.total + " of " + n.total
          : n.earned + " of " + n.total + " earned, " + (n.total - n.earned) + " left"));
        summary.appendChild(text);
        details.appendChild(summary);
        if (n.left.length) {
          const list = el("ul", "map-left");
          n.left.forEach((a) => {
            const item = el("li");
            item.appendChild(el("strong", "", a.label));
            if (a.description) item.appendChild(el("span", "map-left-desc", " — " + a.description));
            list.appendChild(item);
          });
          details.appendChild(list);
        } else {
          details.appendChild(el("p", "map-note", "Everything in this game is earned."));
        }
        if (n.href) {
          const play = el("a", "map-play", "Open " + n.name);
          play.href = n.href;
          details.appendChild(play);
        }
        li.appendChild(details);
        return li;
      }

      function render() {
        const list = nodes.slice();
        if (order === "close") {
          list.sort((a, b) => (a.complete - b.complete) || ((b.earned / b.total) - (a.earned / a.total)) || a.hubIndex - b.hubIndex);
        } else {
          list.sort((a, b) => a.hubIndex - b.hubIndex);
        }
        gridEl.textContent = "";
        list.forEach((n) => gridEl.appendChild(renderNode(n)));
        document.querySelectorAll("#map-controls button").forEach((b) => {
          b.setAttribute("aria-pressed", b.dataset.order === order ? "true" : "false");
        });
      }

      async function main() {
        const [games, manifest, earnedMap] = await Promise.all([
          window.HubGames ? window.HubGames.load() : Promise.resolve([]),
          fetchJson("game-manifest.json"),
          loadEarned(),
        ]);
        const ids = manifest && Array.isArray(manifest.achievements)
          ? manifest.achievements.filter((s) => typeof s === "string" && /^[a-z0-9-]+$/.test(s)) : [];
        if (!ids.length) {
          summaryEl.textContent = "The list of games with achievements could not be read right now. Try again in a moment.";
          return;
        }
        const hubOrder = games.map((g) => g.slug);
        const catalogs = await Promise.all(ids.map((id) => fetchJson("games/" + id + "/achievements.json")));
        nodes = [];
        ids.forEach((id, i) => {
          const cat = catalogs[i];
          if (!cat || !Array.isArray(cat.achievements) || !cat.achievements.length) return;
          const info = games.find((g) => g.slug === id);
          const earnedIds = new Set(earnedMap && earnedMap[id] ? earnedMap[id] : []);
          const total = cat.achievements.length;
          const have = cat.achievements.filter((a) => earnedIds.has(a.id));
          const left = cat.achievements.filter((a) => !earnedIds.has(a.id));
          const idx = hubOrder.indexOf(id);
          nodes.push({
            slug: id, name: info ? info.name : id, href: info ? info.href : "", total, earned: have.length,
            pct: Math.round(have.length / total * 100), complete: have.length === total, left,
            hubIndex: idx < 0 ? 999 : idx,
          });
        });
        if (!nodes.length) { summaryEl.textContent = "No achievement lists could be read right now."; return; }
        const earned = nodes.reduce((s, n) => s + n.earned, 0);
        const total = nodes.reduce((s, n) => s + n.total, 0);
        const done = nodes.filter((n) => n.complete).length;
        if (earnedMap) {
          summaryEl.textContent = earned + " of " + total + " achievements earned (" + Math.round(earned / total * 100) + "%), " + done + " of " + nodes.length + " games complete.";
          noteEl.textContent = "Open a game below to see exactly what is left in it. The ring uses your most recent save of each game.";
          const closest = nodes.filter((n) => !n.complete && n.earned > 0)
            .sort((a, b) => (b.earned / b.total) - (a.earned / a.total))[0];
          if (closest) {
            nextEl.textContent = "Closest to finished: " + closest.name + " (" + closest.left.length + " left).";
            nextEl.hidden = false;
          }
        } else {
          summaryEl.textContent = nodes.length + " games with " + total + " achievements between them. Every ring is empty because you are not signed in.";
          noteEl.textContent = "Sign in on the hub and the rings fill from your saves. The lists below show what each game offers.";
        }
        controlsEl.hidden = false;
        render();
        if (location.hash) {
          const target = document.getElementById(location.hash.slice(1));
          if (target && target.tagName === "DETAILS") { target.open = true; target.scrollIntoView(); }
        }
      }

      document.querySelectorAll("#map-controls button").forEach((b) => {
        b.addEventListener("click", () => { order = b.dataset.order; render(); });
      });
      main();
    })();
  </script>
  <script src="hub-shortcuts.js"></script>
</body>
