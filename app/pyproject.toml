[project]
name = "bcm206-ratings-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]==0.115.0",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "database", "models"]
